[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hh-vacancy-parser"
version = "0.1.0"
description = "HH.ru vacancy parser with SQLite storage and analytics"
requires-python = ">=3.11"

dependencies = [
    "requests",
    "beautifulsoup4",
    "tqdm",
    "pandas",
    "matplotlib",
]

[tool.setuptools]
packages = ["hh_vacancy_parser"]